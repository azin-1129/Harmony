name: CI-frontend

on:
  pull_request:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Set environment values
        run: |
          cd Frontend
          touch ./.env
          echo "${{secrets.FE_ENV}}" > ./.env

      - name: Install Dependencies
        run: npm install

      - name: Build with npm
        run: npm run build
