version: '3'
services:
  frontend:
    container_name: frontend
    image: zupiter/frontend
    ports:
      -  "80:80"
    env_file:
      - ../env/fe.env
    environment:
      TZ: "Asia/Seoul"
    depends_on:
      - backend
    restart: on-failure
  backend:
    container_name: backend
    image: zupiter/backend
    ports:
      -  "8080:8080"
    env_file:
      - ../env/be.env
    environment:
      TZ: "Asia/Seoul"
    depends_on:
      - db
    restart: on-failure
  db:
    container_name: db
    image: mysql:8.4.8
    ports:
      -  "3306:3306"
    env_file:
      - ../env/db.env
    environment:
      TZ: "Asia/Seoul"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: on-failure
